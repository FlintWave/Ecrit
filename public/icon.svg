<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d5b7"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Quill body -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)">
    <!-- Feather shaft -->
    <path d="M 160 352 Q 220 280 340 120" stroke="url(#pen)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Feather vane left -->
    <path d="M 340 120 Q 280 160 240 220 Q 290 180 340 120" fill="#e8d5b7" opacity="0.7"/>
    <!-- Feather vane right -->
    <path d="M 340 120 Q 320 190 300 240 Q 340 180 340 120" fill="#c9a96e" opacity="0.7"/>
    <!-- Broader feather left -->
    <path d="M 300 175 Q 250 210 220 260 Q 270 220 300 175" fill="#e8d5b7" opacity="0.5"/>
    <!-- Broader feather right -->
    <path d="M 300 175 Q 310 230 290 280 Q 310 230 300 175" fill="#c9a96e" opacity="0.5"/>
    <!-- Nib -->
    <path d="M 160 352 L 140 392 L 170 370 Z" fill="url(#nib)"/>
    <!-- Ink dot -->
    <circle cx="140" cy="392" r="4" fill="#4a6fa5"/>
  </g>
  <!-- Subtle text line decorations -->
  <line x1="160" y1="400" x2="280" y2="400" stroke="#4a6fa5" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="180" y1="420" x2="320" y2="420" stroke="#4a6fa5" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="170" y1="440" x2="260" y2="440" stroke="#4a6fa5" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
</svg>