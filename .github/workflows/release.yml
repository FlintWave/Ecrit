name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name Ecrit --windowed --icon public/icon.svg --add-data "public;public" ecrit/main.py

      - name: Package zip
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cd dist
          7z a ../Ecrit-${VERSION}-win64.zip Ecrit/
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Ecrit-*.zip

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name Ecrit --windowed --icon public/icon.svg --add-data "public:public" ecrit/main.py

      - name: Create DMG
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p dmg_staging
          cp -R dist/Ecrit.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Ecrit" -srcfolder dmg_staging -ov -format UDZO "Ecrit-${VERSION}-macos-x86_64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-build
          path: Ecrit-*.dmg

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name Ecrit --windowed --icon public/icon.svg --add-data "public:public" ecrit/main.py

      - name: Create DMG
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p dmg_staging
          cp -R dist/Ecrit.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Ecrit" -srcfolder dmg_staging -ov -format UDZO "Ecrit-${VERSION}-macos-arm64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-build
          path: Ecrit-*.dmg

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon0 libdbus-1-3 \
            libfuse2 ruby ruby-dev build-essential rpm
          sudo gem install fpm

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pyinstaller --name ecrit --add-data "public:public" ecrit/main.py

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -R dist/ecrit/* AppDir/usr/bin/
          cp public/icon.svg AppDir/usr/share/icons/hicolor/256x256/apps/ecrit.svg
          cp public/icon.svg AppDir/ecrit.svg

          cat > AppDir/usr/share/applications/ecrit.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Ecrit
          Exec=ecrit
          Icon=ecrit
          Type=Application
          Categories=Office;TextEditor;
          Comment=Screenplay writing app for Fountain
          DESKTOP
          cp AppDir/usr/share/applications/ecrit.desktop AppDir/ecrit.desktop

          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/ecrit" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir "Ecrit-${VERSION}-linux-x86_64.AppImage"

      - name: Build .deb package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          fpm -s dir -t deb \
            -n ecrit \
            -v "$VERSION" \
            --description "A cross-platform desktop screenplay writing app" \
            --license "GPL-3.0" \
            --url "https://github.com/FlintWave/Ecrit" \
            --maintainer "FlintWave" \
            --category editors \
            --depends libgl1 \
            --depends libdbus-1-3 \
            dist/ecrit/=/opt/ecrit \
            AppDir/usr/share/applications/ecrit.desktop=/usr/share/applications/ecrit.desktop \
            public/icon.svg=/usr/share/icons/hicolor/256x256/apps/ecrit.svg
          mv ecrit_*.deb "ecrit_${VERSION}_amd64.deb"

      - name: Build .rpm package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          fpm -s dir -t rpm \
            -n ecrit \
            -v "$VERSION" \
            --description "A cross-platform desktop screenplay writing app" \
            --license "GPL-3.0" \
            --url "https://github.com/FlintWave/Ecrit" \
            --maintainer "FlintWave" \
            --category Editors \
            --depends libGL.so.1 \
            --depends libdbus-1.so.3 \
            dist/ecrit/=/opt/ecrit \
            AppDir/usr/share/applications/ecrit.desktop=/usr/share/applications/ecrit.desktop \
            public/icon.svg=/usr/share/icons/hicolor/256x256/apps/ecrit.svg
          mv ecrit-*.rpm "ecrit-${VERSION}-1.x86_64.rpm"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: Ecrit-*-linux-x86_64.AppImage

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ecrit_*_amd64.deb

      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: ecrit-*-1.x86_64.rpm

  release:
    needs: [build-windows, build-macos-intel, build-macos-arm, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Ecrit-*-win64.zip
            Ecrit-*-macos-x86_64.dmg
            Ecrit-*-macos-arm64.dmg
            Ecrit-*-linux-x86_64.AppImage
            ecrit_*_amd64.deb
            ecrit-*-1.x86_64.rpm
