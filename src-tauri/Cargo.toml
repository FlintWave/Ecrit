[package]
name = "ecrit-core"
version = "0.1.0"
description = "Écrit screenplay writing app — Rust core"
edition = "2021"

[lib]
name = "ecrit_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
